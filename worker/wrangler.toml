name = "tjpr-llm-proxy"
main = "index.js"
compatibility_date = "2026-08-20"

[vars]
AUTH_VERIFY_URL = "https://script.google.com/macros/s/AKfycby-MudkbcVPAfVDZk2B1zznDlOfjnJOqMB2A3586Ct3ZGq_CUNteKe1lZ4bbw8HwqS9sw/exec"

# API_KEY 是 secret，絕不寫在這個檔案裡。設定方式：
#   npx wrangler secret put API_KEY
#
# 選用：給伺服器端或測試腳本使用的共享密鑰（帶 X-Undercurrent-Key 標頭）。
# 不設定時，所有沒有合法 Origin 的請求都會被拒絕。
#   npx wrangler secret put CLIENT_SHARED_KEY
#
# 速率限制用的 KV namespace（已於 2026-08-20 建立）。
# 若要在別的帳號重建：npx wrangler kv namespace create RATE_LIMIT_KV
# namespace id 只是資源識別碼、不是機密，可以進版控。
# 未綁定或 id 留空時，Worker 會自動略過速率限制（不會因此掛掉）。
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "10473ace38044ccca8feac12eb621fae"

# 全域請求排隊器。上游限制是每分鐘 5 次且跨使用者共用，
# 三個玩家同時上線時必須有人排隊 —— Worker 是唯一的匯流點。
# Durable Object 單執行緒、天然序列化，是唯一能正確發號的選擇
# （KV 是最終一致性，並發時會發出重複號碼）。
[[durable_objects.bindings]]
name = "RPM_QUEUE"
class_name = "RpmQueue"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RpmQueue"]

# 檢索用嵌入模型（@cf/baai/bge-m3）。OpenRouter 型錄內沒有任何 embedding 模型，
# 所以嵌入不與生成同源，改由 Cloudflare Workers AI 就地提供 —— 不需要第二把金鑰。
[ai]
binding = "AI"
